name: Gerar estrutura Flutter
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gerar-estrutura-flutter.yml'
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Instalar SDK Flutter
        run: |
          git clone --depth 1 --branch 3.38.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Gerar arquivos padrão em pasta temporária
        run: |
          flutter create --no-pub --platforms=android,ios,web,linux,macos,windows --project-name treino_em_dia --org com.example "$RUNNER_TEMP/treino_em_dia"
          for platform in android ios web linux macos windows; do
            cp -an "$RUNNER_TEMP/treino_em_dia/$platform" .
          done
          cp -n "$RUNNER_TEMP/treino_em_dia/.metadata" .
          cp "$RUNNER_TEMP/treino_em_dia/.gitignore" .gitignore
          cp -n "$RUNNER_TEMP/treino_em_dia/analysis_options.yaml" .
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pubspec.yaml")
          s = p.read_text()
          if "flutter_lints:" not in s:
              p.write_text(s.replace("dev_dependencies:\n", "dev_dependencies:\n  flutter_lints: ^3.0.2\n", 1))
          PY
          flutter pub get
      - name: Publicar estrutura sem alterar o código do aplicativo
        run: |
          git add android ios web linux macos windows .metadata .gitignore analysis_options.yaml pubspec.yaml pubspec.lock
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: gera estrutura oficial Flutter das seis plataformas"
          git push origin HEAD:main
